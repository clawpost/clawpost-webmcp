name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm audit signatures
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Smoke-test the packed ESM package
        run: |
          package_tarball="$(npm pack --silent)"
          smoke_directory="$(mktemp -d)"
          npm install --ignore-scripts --prefix "$smoke_directory" "./$package_tarball"
          cd "$smoke_directory"
          node --input-type=module -e "await import('@clawpost/webmcp'); await import('@clawpost/webmcp/mock')"
